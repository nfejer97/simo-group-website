<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.__resources={"https://unpkg.com/react@18.3.1/umd/react.production.min.js":"vendor/react.production.min.js","https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js":"vendor/react-dom.production.min.js"};
window.__SIMO_IMAGES=["docs-media","ref-3","ref-2","ref-1","persona-4","persona-3","persona-2","persona-1","article-1","article-2","hero-media","position-main","position-detail","audience-media","footer-media","r-hero-main","r-story-1","r-story-2","r-story-3","r-vision-media"];
window.addEventListener('error',function(e){var t=e.target;if(!t||t.tagName!=='IMG'||!t.hasAttribute('data-slot'))return;var s=t.getAttribute('src')||'';if(s.indexOf('{{')>=0||s.indexOf('%7B')>=0)return;var m=s.match(/assets\/images\/([^\/]+)\.webp$/);if(m&&window.__SIMO_IMAGES.indexOf(m[1])>=0)return;if(s.indexOf('placeholder.svg')<0)t.src='assets/images/placeholder.svg';},true);</script>
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>SIMO Spaces</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;background:#0E1213;color:#fff;-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}
a{color:#fff;text-decoration:none;}
a:hover{color:#fff;}
::selection{background:#399296;color:#fff;}
</style>
</helmet>

<main data-screen-label="01 Márkaválasztó" style="position:relative;font-family:'Hanken Grotesk',system-ui,sans-serif;background:#0E1213;color:#fff;height:{{ pageH }};min-height:{{ pageMinH }};overflow:hidden;">

  <nav aria-label="Üzletágak" onMouseLeave="{{ leave }}" style="position:relative;height:100%;display:flex;flex-direction:{{ dir }};">
    <sc-for list="{{ panels }}" as="p" hint-placeholder-count="3">
      <div onMouseEnter="{{ p.enter }}" style="position:relative;display:block;flex:{{ p.flex }};min-width:0;min-height:{{ p.minH }};overflow:hidden;container-type:inline-size;border-left:{{ p.bl }};border-top:{{ p.bt }};outline:none;opacity:{{ p.op }};transition:flex 560ms cubic-bezier(.22,.7,.2,1),opacity 900ms cubic-bezier(.2,.7,.2,1) {{ p.delay }};">
        <div style="position:absolute;inset:0;transform:scale({{ p.scale }});transition:transform 1400ms cubic-bezier(.2,.7,.2,1);"><img data-slot="{{ p.slot }}" src="assets/images/placeholder.svg" alt="{{ p.ph }}" draggable="false" style="display:block;width:100%;height:100%;aspect-ratio:3 / 2;object-fit:cover;object-position:50% 50%;"></div>
        <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(8,11,12,0.9) 0%,rgba(8,11,12,0.5) 38%,rgba(8,11,12,0.14) 66%,rgba(8,11,12,0.42) 100%);opacity:{{ p.shade }};transition:opacity 520ms ease;"></div>
        <div style="position:absolute;inset:0;pointer-events:none;background:rgba(8,11,12,0.42);opacity:{{ p.dim }};transition:opacity 520ms ease;"></div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:3px;pointer-events:none;background:#399296;transform-origin:left center;transform:scaleX({{ p.line }});transition:transform 560ms cubic-bezier(.22,.7,.2,1);"></div>

        <div style="position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;padding:{{ inPad }};gap:{{ innerGap }};translate:0 {{ p.y }};transition:translate 900ms cubic-bezier(.2,.7,.2,1) {{ p.delay }};">
          <div style="display:flex;flex-direction:column;gap:14px;">
            <span style="font-size:14px;font-weight:500;letter-spacing:0.04em;font-variant-numeric:tabular-nums;color:{{ p.numColor }};transition:color 400ms ease;">{{ p.num }}</span>
            <div style="font-size:{{ nameSize }};white-space:nowrap;line-height:0.92;letter-spacing:-0.035em;font-weight:600;color:#fff;text-shadow:0 2px 30px rgba(0,0,0,0.25);">{{ p.name }}</div>
          </div>
          <a href="{{ p.href }}" onFocus="{{ p.enter }}" aria-label="{{ p.aria }}" style="pointer-events:auto;cursor:pointer;color:#fff;display:flex;flex-direction:column;gap:16px;padding:{{ barPad }};border-radius:6px;background:{{ p.glass }};border:1px solid {{ p.gbd }};box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),inset 0 -1px 0 rgba(255,255,255,0.06);backdrop-filter:blur(20px) saturate(160%) brightness(0.9);-webkit-backdrop-filter:blur(20px) saturate(160%) brightness(0.9);transition:background 520ms ease,border-color 520ms ease;">
            <p style="margin:0;font-size:{{ descSize }};line-height:1.45;color:#fff;text-wrap:pretty;">{{ p.desc }}</p>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.14);">
              <span style="position:relative;display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:#fff;white-space:nowrap;">
                Felfedezem az üzletágat
                <span style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:{{ p.arrBg }};border:1px solid {{ p.arrBd }};transition:background 400ms ease,border-color 400ms ease;"><span style="display:block;font-size:15px;line-height:1;translate:{{ p.arrX }} {{ p.arrY }};transition:translate 420ms cubic-bezier(.22,.7,.2,1);">↗</span></span>
                <span style="position:absolute;left:0;right:42px;bottom:-6px;height:1px;background:#7BC6C9;transform-origin:left center;transform:scaleX({{ p.ul }});transition:transform 480ms cubic-bezier(.22,.7,.2,1);"></span>
              </span>
              <span style="font-size:12px;letter-spacing:0.04em;color:rgba(255,255,255,0.56);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:{{ domDisplay }};">{{ p.domain }}</span>
            </div>
          </a>
        </div>
      </div>
    </sc-for>
  </nav>

  <header style="position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;display:flex;justify-content:center;padding-top:{{ logoTop }};padding-bottom:48px;background:linear-gradient(180deg,rgba(8,11,12,0.55) 0%,rgba(8,11,12,0) 100%);opacity:{{ logoOp }};transition:opacity 900ms cubic-bezier(.2,.7,.2,1);">
    <img src="./assets/simo-logo-white.png" alt="SIMO Spaces" style="height:{{ logoH }};width:auto;display:block;">
  </header>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { hover: -1, vw: 1440, ready: false };
  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener('resize', this.onResize); this.onResize();
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ ready: true })));
    this.readyT = setTimeout(() => { if (!this.state.ready) this.setState({ ready: true }); }, 80);
    this.introT = setTimeout(() => { this.introDone = true; }, 1400);
  }
  componentWillUnmount() { clearTimeout(this.readyT); clearTimeout(this.introT); window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const S = this.state, desk = S.vw >= 1024, mob = S.vw < 700, row = !mob, tab = row && !desk;
    const defs = [
      ['PARTITIONS', 'partitions.simospaces.com', 'Modern üvegfalrendszerek, térelválasztók és belsőépítészeti megoldások.', 'PARTITIONS · üvegfalas irodatér, üveg térelválasztók'],
      ['ALU', 'alu.simospaces.com', 'Modern alumínium építészeti rendszerek és megoldások.', 'ALU · alumínium homlokzat / szerkezet'],
      ['INSTALLATION', 'installation.simospaces.com', 'Professzionális szerelési és kivitelezési szolgáltatások.', 'INSTALLATION · üvegszerkezet szerelése / elkészült installáció']
    ];
    return {
      pageH: mob ? 'auto' : '100vh', pageMinH: mob ? '100svh' : '640px',
      dir: row ? 'row' : 'column',
      logoTop: mob ? '24px' : '44px', logoH: mob ? '52px' : desk ? '68px' : '60px', logoOp: S.ready ? 1 : 0,
      inPad: mob ? '24px 20px 20px' : desk ? '40px' : '28px 22px',
      innerGap: mob ? '18px' : '24px',
      barPad: tab ? '16px' : '20px 22px',
      descSize: tab ? '16px' : '17px',
      nameSize: mob ? 'min(48px,12cqw)' : 'min(80px,11cqw)',
      domDisplay: tab ? 'none' : 'block',
      leave: () => this.setState({ hover: -1 }),
      panels: defs.map(([name, domain, desc, ph], i) => {
        const on = desk ? S.hover === i : true, hot = S.hover === i, dim = desk && S.hover >= 0 && !hot;
        const delay = !this.introDone ? (200 + i * 140) + 'ms' : '0ms';
        return {
          name, domain, desc, ph, num: '0' + (i + 1), slot: 'spaces-panel-' + (i + 1),
          href: i === 0 ? 'homepage.html' : undefined, aria: name + ' – ' + domain,
          flex: row ? (desk && hot ? '1.38 1 0' : '1 1 0') : '0 0 auto',
          minH: mob ? 'max(240px,calc(100svh / 3))' : '0px',
          bl: row && i > 0 ? '1px solid rgba(255,255,255,0.14)' : '0', bt: !row && i > 0 ? '1px solid rgba(255,255,255,0.14)' : '0',
          op: S.ready ? 1 : 0, y: S.ready ? '0px' : '24px', delay,
          scale: hot ? 1.05 : 1, shade: hot ? 0.7 : 1, dim: dim ? 1 : 0, line: hot || (!desk) ? 1 : 0,
          numColor: hot || !desk ? '#7BC6C9' : 'rgba(255,255,255,0.72)',
          glass: hot ? 'linear-gradient(155deg,rgba(57,146,150,0.5) 0%,rgba(57,146,150,0.2) 100%),rgba(255,255,255,0.05)' : 'linear-gradient(155deg,rgba(255,255,255,0.15) 0%,rgba(255,255,255,0.05) 42%,rgba(255,255,255,0.02) 100%),rgba(22,58,60,0.26)',
          gbd: hot ? 'rgba(120,200,204,0.7)' : 'rgba(255,255,255,0.1)',
          arrBg: on ? '#399296' : 'rgba(255,255,255,0.08)', arrBd: on ? '#399296' : 'rgba(255,255,255,0.32)',
          arrX: hot ? '2px' : '0px', arrY: hot ? '-2px' : '0px', ul: hot ? 1 : 0,
          enter: () => { if (S.hover !== i) this.setState({ hover: i }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
